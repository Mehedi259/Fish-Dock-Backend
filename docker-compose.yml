version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fishdock_postgres
    environment:
      POSTGRES_DB: fishdock_db
      POSTGRES_USER: fishdock_user
      POSTGRES_PASSWORD: fishdock_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fishdock_user -d fishdock_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fishdock_network

  redis:
    image: redis:7-alpine
    container_name: fishdock_redis
    ports:
      - "6379:6379"
    networks:
      - fishdock_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fishdock_api
    command: >
      sh -c "python manage.py migrate &&
             python seed_data.py &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=fishdock-super-secret-production-key-2026-v1
      - DATABASE_URL=postgres://fishdock_user:fishdock_password@postgres:5432/fishdock_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - fishdock_network

  website:
    build:
      context: ../../website/Fish-Dock-Website
      dockerfile: Dockerfile
    container_name: fishdock_website
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    networks:
      - fishdock_network

  dashboard:
    build:
      context: ../../website/Fish-Dock-Admin-Dashboard
      dockerfile: Dockerfile
    container_name: fishdock_dashboard
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    networks:
      - fishdock_network

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  fishdock_network:
    driver: bridge

