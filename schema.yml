          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductWrite'
          description: ''
    delete:
      operationId: v1_products_destroy
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/settings/admin/:
    get:
      operationId: v1_settings_admin_retrieve
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: v1_settings_admin_create
      description: |-
        Updates multiple settings at once:
        {"settings": [{"key": "WHATSAPP_BUSINESS_NUMBER", "value": "+8801711111111"}, ...]}
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/settings/public/:
    get:
      operationId: v1_settings_public_retrieve
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
components:
  schemas:
    Banner:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 200
        subtitle:
          type: string
          nullable: true
          maxLength: 300
        badge_text:
          type: string
          maxLength: 60
        image_url:
          type: string
          format: uri
          maxLength: 500
        button_text:
          type: string
          maxLength: 50
        link_url:
          type: string
          maxLength: 255
        display_order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - image_url
      - title
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
        bangla_name:
          type: string
          nullable: true
          maxLength: 150
        slug:
          type: string
          maxLength: 150
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
          nullable: true
        icon_name:
          type: string
          description: Icon identifier such as 'fish', 'waves', 'shrimp', 'crab',
            etc.
          maxLength: 50
        image_url:
          nullable: true
          oneOf:
          - type: string
            format: uri
            maxLength: 500
          - type: string
            maxLength: 0
        display_order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        is_active:
          type: boolean
        product_count:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - product_count
      - slug
      - updated_at
    CustomTokenObtainPair:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - password
      - username
    FAQ:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        question:
          type: string
          maxLength: 300
        answer:
          type: string
        category:
          type: string
          maxLength: 80
        display_order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - answer
      - created_at
      - id
      - question
    Inventory:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        product:
          type: string
          format: uuid
        product_name:
          type: string
          readOnly: true
        product_slug:
          type: string
          readOnly: true
        product_unit:
          type: string
          readOnly: true
        category_name:
          type: string
          readOnly: true
        track_stock:
          type: boolean
          description: Enable or disable stock tracking for this product
        available_quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        reserved_quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
