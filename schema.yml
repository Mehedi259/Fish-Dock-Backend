          type: array
          items:
            $ref: '#/components/schemas/InventoryTransaction'
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - category_name
      - id
      - product
      - product_name
      - product_slug
      - product_unit
      - transactions
      - updated_at
    InventoryTransaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        inventory:
          type: string
          format: uuid
        transaction_type:
          $ref: '#/components/schemas/TransactionTypeEnum'
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        balance_after:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        reason:
          type: string
          maxLength: 255
        created_by:
          type: integer
          nullable: true
        created_by_username:
          type: string
          readOnly: true
          default: System
        notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - balance_after
      - created_at
      - created_by_username
      - id
      - inventory
      - quantity
      - reason
    OrderDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        order_reference:
          type: string
          description: Unique customer-facing order ID (e.g. FD-2026-1001)
          maxLength: 32
        customer_name:
          type: string
          maxLength: 150
        customer_phone:
          type: string
          maxLength: 25
        customer_email:
          nullable: true
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        delivery_address:
          type: string
        delivery_area:
          type: string
          description: Neighborhood or area for logistics dispatch
          maxLength: 100
        delivery_city:
          type: string
          maxLength: 60
        preferred_delivery_slot:
          type: string
          description: Morning, Afternoon, Evening, or Express
          maxLength: 100
        customer_notes:
          type: string
          nullable: true
          description: Customer instructions, special cleaning/cutting requests
        status:
          $ref: '#/components/schemas/StatusEnum'
        whatsapp_status:
          $ref: '#/components/schemas/WhatsappStatusEnum'
        indicative_subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Sum of indicative item prices at time of request
        delivery_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        final_confirmed_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
          description: Actual finalized price agreed with customer via WhatsApp
        admin_notes:
          type: string
          nullable: true
          description: Internal staff notes, e.g. 'Customer requested 2 big pieces'
        confirmed_by_name:
          type: string
          readOnly: true
        confirmed_at:
          type: string
          format: date-time
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
          readOnly: true
        status_history:
          type: array
          items:
            $ref: '#/components/schemas/OrderStatusHistory'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - confirmed_by_name
      - created_at
      - customer_name
      - customer_phone
      - delivery_address
      - id
      - items
      - order_reference
      - status_history
      - updated_at
    OrderItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        product:
          type: string
          format: uuid
          nullable: true
        product_name_snapshot:
          type: string
          maxLength: 200
        unit_snapshot:
          type: string
          maxLength: 20
        standard_weight_range_snapshot:
          type: string
          nullable: true
          maxLength: 100
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          description: Quantity or weight in specified unit
        unit_price_snapshot:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Indicative unit price when order was submitted
        indicative_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        final_unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
          description: Final price agreed per unit
        final_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
          description: Final amount for this item
        quantity_adjusted:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          nullable: true
          description: Adjusted weight after weighing exact fresh fish
        adjustment_reason:
          type: string
          nullable: true
          description: e.g. 'Padma Ilish was exactly 1.15 kg'
          maxLength: 255
        cutting_instruction:
          type: string
          description: e.g. 'Whole', 'Curry Cut', 'Steak Cut', 'Cleaned'
          maxLength: 100
      required:
      - id
      - product_name_snapshot
      - quantity
    OrderStatusHistory:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        previous_status:
          type: string
          nullable: true
          maxLength: 40
        new_status:
          type: string
          maxLength: 40
        changed_by_name:
          type: string
          readOnly: true
          default: System / Customer
        notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - changed_by_name
      - created_at
      - id
      - new_status
